{% extends "index.html" %}

{% block title %} add {% endblock %}

{% block body %}
{% include "flash.html" %}
<div class="d-flex justify-content-center align-content-center">

    <div class="d-flex flex-column gap-3 justify-content-center vh-100 align-content-center" style="width: 100%; max-width: 400px;">
        <form action="/login" method="post" class="d-flex flex-column gap-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h2>Login</h2>
        <div class="form-floating">
            <input autocomplete="off" autofocus class="form-control" 
            name="email-or-username" id="email" type="text" placeholder="Email or Username" required>
            <label for="email">Email or Username</label>
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" 
            name="password" id="password" placeholder="Password" required>
            <label for="password">Password</label>
        </div>
        <button class="btn btn-primary" type="submit">Log in</button>
        <p>don't have an account? <a href="/register">register an account</a></p>
    </form>
</div>
</div>



{% endblock %}
